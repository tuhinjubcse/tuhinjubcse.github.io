* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 24px; }
.legend { display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; vertical-align: -1px; margin-right: 6px; }
.k-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
.k-bf { width: 10px; height: 10px; background: var(--accent); transform: rotate(45deg); }
.k-old { width: 9px; height: 9px; border: 1.5px solid var(--ink); transform: rotate(45deg); }
.k-max { width: 18px; border-top: 1.5px dashed var(--muted); vertical-align: 3px !important; }
.k-med { width: 18px; border-top: 1.5px solid var(--muted); vertical-align: 3px !important; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 14px 6px; min-width: 0; }
.panel h2 { font-size: 15px; font-weight: 500; margin: 0; }
.panel p { margin: 2px 0 6px; font-size: 13px; color: var(--muted); }
.panel p q { font-family: var(--display); font-style: italic; font-size: 14px; color: var(--ink); quotes: "\201C" "\201D"; }
.chart { width: 100%; }
.chart svg { display: block; overflow: visible; }
.axis text, .axis-ab { fill: var(--muted); font-family: var(--mono); font-size: 11px; }
.k-flag { width: 10px; height: 10px; border-radius: 1.5px; background: var(--flag); }
.axis line, .axis path { stroke: var(--rule); }
.gridline { stroke: var(--rule); stroke-width: 1; }
.lbl { font-family: var(--body); font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round; }
.lbl.acc { fill: var(--accent); font-weight: 500; }
.lbl.mut { fill: var(--muted); }
.tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.4; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.12); opacity: 0; transition: opacity .1s; z-index: 5; }
.tip .t { font-weight: 500; }
.tip .m { color: var(--muted); }
.tip .v { font-family: var(--mono); }
@media (prefers-reduced-motion: reduce) { .tip { transition: none; } }
</style>

const fmt = d3.format(".2f"), fmtW = d3.format(",");
const tip = document.getElementById("tip");
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function showTip(ev, html) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
function hideTip() { tip.style.opacity = 0; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

const host = d3.select("#panels");

  card.append("h2").text(P.title);
  card.append("p").html("e.g. <q>" + esc(P.ex) + "</q>");

});

function draw() {
  PANELS.forEach(P => {
    const box = d3.select("#" + P.id + " .chart");
    box.selectAll("*").remove();
    const W = box.node().clientWidth, H = 250;
    const m = { t: 22, r: 14, b: 26, l: 40 };
    const svg = box.append("svg").attr("width", W).attr("height", H)
      .attr("role", "img").attr("aria-label", P.title + ": rate per 1,000 words by publication year for 97 books and three stories");
    const maxBook = d3.max(BOOKS, d => d[P.k]);
    const bf = STORIES[2][P.k];
    const x = d3.scaleLinear().domain([2000.3, 2032]).range([m.l, W - m.r]);
    const y = d3.scaleLinear().domain([0, Math.max(bf, maxBook, d3.max(FLAGGED, d => d[P.k])) * 1.12]).nice(4).range([H - m.b, m.t]);

    svg.append("g").selectAll("line").data(y.ticks(4)).join("line")
      .attr("class", "gridline").attr("x1", m.l).attr("x2", W - m.r).attr("y1", d => y(d)).attr("y2", d => y(d));
    svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - m.b})`)
      .call(d3.axisBottom(x).tickValues([2001, 2005, 2009, 2013, 2017, 2021, 2025]).tickFormat(d3.format("d")).tickSize(4))
      .call(g => g.select(".domain").remove());
    svg.append("g").attr("class", "axis").attr("transform", `translate(${m.l},0)`)
      .call(d3.axisLeft(y).ticks(4).tickSize(0).tickPadding(8))
      .call(g => g.select(".domain").remove());
    svg.append("text").attr("class", "lbl mut").attr("x", m.l).attr("y", 10).attr("font-size", 11).text("per 1,000 words");

    svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(maxBook)).attr("y2", y(maxBook))
      .attr("stroke", css("--muted")).attr("stroke-dasharray", "4 4").attr("stroke-width", 1.2);
    svg.append("text").attr("class", "lbl mut").attr("x", m.l + 4).attr("y", y(maxBook) - 5).attr("font-size", 11)
      .text("highest book " + fmt(maxBook));

    const med = d3.median(BOOKS, d => d[P.k]);
    svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(med)).attr("y2", y(med))
      .attr("stroke", css("--muted")).attr("stroke-width", 1.2).attr("stroke-opacity", 0.8);
    svg.append("text").attr("class", "lbl mut").attr("x", m.l + 4).attr("y", y(med) - 5).attr("font-size", 11)
      .text("median book " + fmt(med));

    const jitter = d => ((d.t.length * 37 + d.w) % 100) / 100 * 0.6 - 0.3;
    svg.append("g").selectAll("circle").data(BOOKS).join("circle")
      .attr("cx", d => x(d.y + jitter(d))).attr("cy", d => y(d[P.k])).attr("r", 4.2)
      .attr("fill", css("--dot")).attr("fill-opacity", 0.75).attr("stroke", css("--surface")).attr("stroke-width", 1)
      .on("pointermove", (ev, d) => showTip(ev, `<div class="t">${esc(d.t)}</div><div class="m">${esc(d.a)} · ${d.y} · ${fmtW(d.w)} words</div><div class="v">${fmt(d[P.k])} per 1k words</div>`))
      .on("pointerleave", hideTip);

    const sym = d3.symbol().type(d3.symbolDiamond);
    const g = svg.append("g");
    STORIES.forEach(s => {
      const cx = x(s.y), cy = y(s[P.k]);
      g.append("path").attr("d", sym.size(s.bf ? 150 : 95)()).attr("transform", `translate(${cx},${cy})`)
        .attr("fill", s.bf ? css("--accent") : css("--surface"))
        .attr("stroke", s.bf ? css("--surface") : css("--ink")).attr("stroke-width", s.bf ? 2 : 1.6)
        .style("cursor", "default")
        .on("pointermove", ev => showTip(ev, `<div class="t">${esc(s.t)}</div><div class="m">Kundizeza · ${s.y} · ${fmtW(s.w)} words</div><div class="v">${fmt(s[P.k])} per 1k words</div>`))
        .on("pointerleave", hideTip);
    });
    const dv = x(2027.0);
    svg.append("rect").attr("x", dv).attr("y", m.t - 4).attr("width", W - m.r - dv + 4).attr("height", H - m.b - m.t + 4)
      .attr("fill", css("--bg")).attr("opacity", 0.55).lower();
    svg.append("line").attr("x1", dv).attr("x2", dv).attr("y1", m.t - 4).attr("y2", H - m.b).attr("stroke", css("--rule")).attr("stroke-width", 1);
    svg.append("text").attr("class", "lbl mut").attr("x", (dv + W - m.r) / 2).attr("y", m.t - 8).attr("text-anchor", "middle").attr("font-size", 10.5).text("");
    FLAGGED.forEach(f => {
      const fx = x(f.xp), fy = y(f[P.k]);
      svg.append("rect").attr("x", fx - 5.5).attr("y", fy - 5.5).attr("width", 11).attr("height", 11).attr("rx", 1.5)
        .attr("fill", css("--flag")).attr("stroke", css("--surface")).attr("stroke-width", 1.5)
        .on("pointermove", ev => showTip(ev, `<div class="t">${esc(f.t)}</div><div class="m">${esc(f.a)} · ${f.y} · ${fmtW(f.w)} words</div><div class="v">${fmt(f[P.k])} per 1k words</div>`))
        .on("pointerleave", hideTip);
      svg.append("text").attr("class", "axis-ab").attr("x", fx).attr("y", H - m.b + 15).attr("text-anchor", "middle").text(f.ab);
    });
    const bfS = STORIES[2];
    const bx = x(bfS.y), by = y(bfS[P.k]);
    svg.append("text").attr("class", "lbl acc").attr("x", bx - 12).attr("y", by - 15).attr("text-anchor", "end")
      .text("The Blue Fighter " + fmt(bfS[P.k]));
    const ratio = bfS[P.k] / maxBook;
    svg.append("text").attr("class", "lbl mut").attr("x", bx - 12).attr("y", by - 2).attr("text-anchor", "end").attr("font-size", 11)
      .text(d3.format(".1f")(bfS[P.k] / med) + "× the median · " + d3.format(".1f")(ratio) + "× the highest book");
    svg.selectAll("text.lbl").raise();
  });
}
draw();
let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(draw, 80); }).observe(document.getElementById("panels"));
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
</script>
</body>
</html>
